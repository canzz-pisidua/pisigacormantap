name: Gaming RDP

on:
  workflow_dispatch:

jobs:
  gaming-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # 1. SETUP JOB
      # ==========================================
      - name: Set up job
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "       GAMING RDP - 64 BIT"
          Write-Host "======================================"
          Write-Host "Windows architecture:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object OSArchitecture

      # ==========================================
      # 2. CONFIGURE RDP
      # ==========================================
      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService

          Write-Host "RDP configured."

      # ==========================================
      # 3. OPTIMIZE RDP GRAPHICS
      # ==========================================
      - name: Optimize RDP Graphics
        shell: powershell
        run: |
          Write-Host "Optimizing RDP graphics..."

          # Enable AVC/H.264 graphics where supported
          New-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name "AVC444ModePreferred" `
            -PropertyType DWORD `
            -Value 1 `
            -Force

          New-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name "AVCHardwareEncodePreferred" `
            -PropertyType DWORD `
            -Value 1 `
            -Force

          # Prefer high quality graphics
          New-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name "MaxCompressionRatio" `
            -PropertyType DWORD `
            -Value 2 `
            -Force

          Write-Host "RDP graphics optimization completed."

      # ==========================================
      # 4. INSTALL DIRECTX 9 LEGACY COMPONENTS
      # ==========================================
      - name: Install DirectX 9 Legacy Components
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe"
          $installer = "$env:TEMP\directx_Jun2010_redist.exe"
          $extract = "$env:TEMP\DirectX_Jun2010"

          Write-Host "Downloading Microsoft DirectX June 2010..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "DirectX installer failed to download."
          }

          Write-Host "Download completed."

          # Create extraction directory
          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            -Force | Out-Null

          Write-Host "Extracting DirectX files..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/Q /T:$extract" `
            -Wait

          $dxsetup = Join-Path $extract "DXSETUP.exe"

          if (!(Test-Path $dxsetup)) {
            throw "DXSETUP.exe was not found after extraction."
          }

          Write-Host "Installing DirectX legacy components..."

          Start-Process `
            -FilePath $dxsetup `
            -ArgumentList "/silent" `
            -Wait

          Write-Host "DirectX 9 legacy components installed successfully."

            # ==========================================
      # 5. CREATE RDP USER
      # ==========================================
      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "Pc123@_"
          $password = "apasI123@_"

          Write-Host "Creating RDP user..."

          # Hapus user jika sebelumnya sudah ada
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existing) {
            Remove-LocalUser -Name $username
          }

          # Buat password
          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Buat user
          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -FullName "Gaming User" `
            -Description "Gaming RDP User"

          # Password tidak kedaluwarsa
          Set-LocalUser `
            -Name $username `
            -PasswordNeverExpires $true

          # Administrator
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          # Remote Desktop
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          Write-Host "======================================"
          Write-Host "RDP USER CREATED"
          Write-Host "======================================"
          Write-Host "Username: $username"
      # ==========================================
      # 6. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing Tailscale..."

          $tailscaleUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $tailscaleInstaller = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tailscaleUrl `
            -OutFile $tailscaleInstaller `
            -UseBasicParsing

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$tailscaleInstaller`" /qn /norestart" `
            -Wait

          Write-Host "Tailscale installed."

      # ==========================================
      # 7. CONNECT TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Connecting to Tailscale..."

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is not configured."
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw "Tailscale executable was not found."
          }

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTHKEY" `
            --hostname="gaming-rdp"

          Write-Host "Tailscale connected."

      # ==========================================
      # 8. VERIFY RDP
      # ==========================================
      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Checking RDP service..."

          Get-Service TermService

          Write-Host ""
          Write-Host "Checking RDP port..."

          $rdpPort = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($rdpPort) {
            Write-Host "RDP port 3389 is LISTENING."
          }
          else {
            Write-Warning "RDP port 3389 is not currently listening."
          }

          Write-Host ""
          Write-Host "Checking Tailscale..."

          & "C:\Program Files\Tailscale\tailscale.exe" status

      # ==========================================
      # 9. SHOW RDP INFORMATION
      # ==========================================
      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "          GAMING RDP READY"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "RDP USERNAME:"
          Write-Host "Gamer"

          Write-Host ""
          Write-Host "RDP PASSWORD:"
          Write-Host "Gaming@12345"

          Write-Host ""
          Write-Host "TAILSCALE STATUS:"
          & "C:\Program Files\Tailscale\tailscale.exe" status

          Write-Host ""
          Write-Host "TAILSCALE IP:"
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "======================================"
          Write-Host "        CONNECT USING RDP APP"
          Write-Host "======================================"

      # ==========================================
      # 10. KEEP RUNNER ALIVE
      # ==========================================
      - name: Keep RDP Alive
        shell: powershell
        run: |
          Write-Host "RDP is running..."
          Write-Host "Keeping the gaming RDP alive."

          while ($true) {
            Start-Sleep -Seconds 300

            Write-Host ""
            Write-Host "[$(Get-Date)] RDP still running..."

            & "C:\Program Files\Tailscale\tailscale.exe" status
          }
